<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REGIS-viewer</title>
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <aside id="zijbalk">
    <header class="kop">
      <div class="kop-titel">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M2 6h20M2 11h20M2 16h20M2 21h20" /><path d="M2 6c4 2 8 2 10 0s6-2 10 0" class="golf"/></svg>
        </span>
        <div>
          <h1>REGIS-viewer</h1>
          <div id="gebied" class="sub">laden…</div>
        </div>
      </div>
      <button id="btn-link" class="knop klein" title="Kopieer een link naar deze weergave">Link kopiëren</button>
    </header>

    <section class="blok">
      <h2>Weergave</h2>
      <div id="modus" class="segment" role="radiogroup" aria-label="Weergave">
        <button data-m="verbreiding" aria-pressed="true">Verbreiding</button>
        <button data-m="top">Top</button>
        <button data-m="basis">Basis</button>
        <button data-m="dikte">Dikte</button>
        <button data-m="kh" class="k">kh</button>
        <button data-m="kv" class="k">kv</button>
        <button data-m="c" class="k" title="Hydraulische weerstand = dikte / kv">c</button>
      </div>
      <div id="legenda" class="legenda" hidden>
        <canvas id="legenda-balk" width="256" height="12"></canvas>
        <div class="legenda-bereik">
          <input id="leg-min" type="number" step="any" aria-label="Minimum">
          <span id="leg-eenheid" class="eenheid"></span>
          <button id="leg-auto" class="knop klein licht" title="Bereik automatisch bepalen">auto</button>
          <input id="leg-max" type="number" step="any" aria-label="Maximum">
        </div>
      </div>
      <label class="schuif">
        <span>Dekking</span>
        <input id="dekking" type="range" min="0.2" max="1" step="0.05" value="0.8">
      </label>
    </section>

    <section id="boringen-blok" class="blok" hidden>
      <h2>Boringen <span id="boringen-teller" class="teller"></span></h2>
      <div class="bor-filter">
        <label>Min. diepte
          <select id="bor-min">
            <option value="0">alle</option><option value="5">5 m</option><option value="10" selected>10 m</option>
            <option value="20">20 m</option><option value="50">50 m</option>
          </select>
        </label>
        <label class="vink"><input id="bor-laag" type="checkbox" checked> alleen als ze de gekozen laag bereiken</label>
      </div>
      <div id="bor-legenda" class="bor-legenda"></div>
    </section>

    <section id="sonderingen-blok" class="blok" hidden>
      <h2>Sonderingen <span id="son-teller" class="teller"></span></h2>
      <div class="bor-filter">
        <label>Min. diepte
          <select id="son-min">
            <option value="0">alle</option><option value="5">5 m</option><option value="10" selected>10 m</option>
            <option value="20">20 m</option><option value="50">50 m</option>
          </select>
        </label>
        <label class="vink"><input id="son-laag" type="checkbox" checked> alleen als ze de gekozen laag bereiken</label>
      </div>
      <div id="son-legenda" class="bor-legenda"></div>
    </section>

    <section id="peilbuizen-blok" class="blok" hidden>
      <h2>Peilbuizen <span id="peil-teller" class="teller"></span></h2>
      <div class="bor-filter">
        <label class="vink"><input id="peil-laag" type="checkbox" checked> alleen putten met een filter in de gekozen laag</label>
      </div>
      <div id="peil-legenda" class="bor-legenda"></div>
    </section>

    <section class="blok lagen-blok">
      <div class="lagen-kop">
        <h2>Lagen <span id="lagen-teller" class="teller"></span></h2>
        <label class="vink"><input id="alleen-in-beeld" type="checkbox" checked> <span id="alleen-in-beeld-tekst">alleen in beeld</span></label>
      </div>
      <input id="zoek" type="search" placeholder="Zoek op code of naam (bijv. PZWA, klei)" autocomplete="off">
      <ol id="lagen" class="lagen" aria-label="REGIS-lagen"></ol>
    </section>

    <footer class="voet">
      <div id="bron"></div>
      <div>Achtergrond: PDOK/Kadaster · Boringen, sonderingen en peilbuizen: BRO (BHR-G, CPT, GMW)</div>
    </footer>
  </aside>

  <main id="hoofd">
    <div id="kaart"></div>

    <div class="gereedschap" role="toolbar" aria-label="Gereedschap">
      <button id="btn-doorsnede" class="knop" title="Klik punten op de kaart; dubbelklik of 'Klaar' om af te ronden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 L11 8 L20 13"/><circle cx="4" cy="18" r="2"/><circle cx="11" cy="8" r="2"/><circle cx="20" cy="13" r="2"/></svg>
        Doorsnede
      </button>
      <button id="btn-gebied" class="knop" aria-pressed="false" title="Teken een rechthoek of polygoon; daarna wordt alles alleen binnen dat gebied getoond">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7 L12 3 L20 8 L17 20 L6 18 Z" stroke-dasharray="3 2"/></svg>
        <span id="btn-gebied-tekst">Gebied</span>
      </button>
      <button id="btn-boringen" class="knop" aria-pressed="false" title="BRO geologische boringen (BHR-G) tonen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M8 7h8M8 12h8M8 17h8"/></svg>
        Boringen
      </button>
      <button id="btn-sonderingen" class="knop" aria-pressed="false" title="BRO sonderingen (CPT) tonen; bij aanklikken omgezet naar zand/leem/klei/veen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5 H18 L12 20 Z"/></svg>
        Sonderingen
      </button>
      <button id="btn-peilbuizen" class="knop" aria-pressed="false" title="BRO peilbuizen (grondwatermonitoringputten) met filterdieptes tonen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h4M12 3v18"/><rect x="10" y="14" width="4" height="5"/></svg>
        Peilbuizen
      </button>
      <select id="achtergrond" class="knop" aria-label="Achtergrondkaart">
        <option value="grijs">Kaart grijs</option>
        <option value="standaard">Kaart kleur</option>
        <option value="luchtfoto">Luchtfoto</option>
        <option value="geen">Geen</option>
      </select>
    </div>

    <div id="tekenhulp" class="tekenhulp" hidden>
      <div id="gebied-keuze" class="segment donker" hidden>
        <button data-soort="rechthoek">Rechthoek</button>
        <button data-soort="polygoon">Polygoon</button>
      </div>
      <span id="tekenhulp-tekst">Klik het beginpunt van de doorsnede</span>
      <button id="btn-klaar" class="knop klein primair" disabled>Klaar</button>
      <button id="btn-annuleer" class="knop klein licht">Annuleren</button>
    </div>

    <div id="cursor-info" class="cursor-info" hidden></div>
    <div id="melding" class="melding" hidden></div>
    <div id="voortgang" class="voortgang" hidden><div></div></div>

    <section id="paneel" class="paneel" hidden>
      <header class="paneel-kop">
        <h2 id="paneel-titel"></h2>
        <div class="paneel-acties" id="paneel-acties"></div>
        <button id="paneel-sluit" class="knop klein licht" aria-label="Sluiten">✕</button>
      </header>
      <div id="paneel-inhoud" class="paneel-inhoud"></div>
    </section>
    <div id="tip" class="tip" hidden></div>
  </main>

  <script src="lib/leaflet.js"></script>
  <script src="lib/proj4.js"></script>
  <script src="lib/proj4leaflet.js"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
